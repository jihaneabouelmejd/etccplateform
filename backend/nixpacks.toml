[phases.setup]
nixPkgs = ["nodejs_20", "tesseract"]

[phases.install]
cmds = ["npm install --legacy-peer-deps --include=dev"]

# Le tessdata fra/ara est commité directement dans backend/tessdata/ (le
# téléchargement curl pendant le build Railway échouait silencieusement —
# voir historique git). Rien à faire ici, les fichiers sont déjà dans le repo.
[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npx prisma migrate deploy && node dist/src/main"